services:
  postgres:
    image: postgres:16-alpine
    container_name: messaging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: messaging
      POSTGRES_PASSWORD: messaging
      POSTGRES_DB: messaging
    ports:
      - '5432:5432'
    volumes:
      - messaging_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U messaging -d messaging']
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:16-alpine
    container_name: messaging-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: messaging
      POSTGRES_PASSWORD: messaging
      POSTGRES_DB: messaging_test
    ports:
      - '5433:5432'
    volumes:
      - messaging_pg_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U messaging -d messaging_test']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  messaging_pg_data:
  messaging_pg_test_data:
